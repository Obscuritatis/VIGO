<style>
/* Lettertypes staan op de site zelf (fonts/), zodat bezoekers geen verbinding met Google maken. */
@font-face { font-family: "Nunito"; font-weight: 400; font-display: swap; src: url(fonts/nunito-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 600; font-display: swap; src: url(fonts/nunito-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 700; font-display: swap; src: url(fonts/nunito-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Nunito"; font-weight: 800; font-display: swap; src: url(fonts/nunito-latin-800-normal.woff2) format("woff2"); }
/* Layout: smalle werkkolom; overzicht van sites → inventaris en nazichten van één site (breadcrumb-navigatie). Warme stijl: crème achtergrond, groenblauw accent, elke soort en elke site een eigen kleur. */
:root {
  --bg: #f6f1e9;
  --surface: #fffdf9;
  --fg: #2b2722;
  --muted: #776b5f;
  --line: #e7ddd0;
  --accent: #2f6f62;      /* warm groenblauw */
  --accent-fg: #ffffff;
  --accent-bg: #dfeee8;
  --warm: #d08a2e;        /* oker */
  --k-rolstoel: #2f6f62; --k-rollator: #b8661f; --k-looprek: #7b4f8f; --k-kruk: #a64a6a;
  --open: #b4492f;        /* terracotta */
  --shadow: 0 1px 2px rgba(80, 55, 30, .06), 0 4px 14px rgba(80, 55, 30, .05);
  --font-display: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1916; --surface: #25221e; --fg: #f1eae0; --muted: #b3a698; --line: #3b352f;
    --accent: #86cdb9; --accent-fg: #0f2621; --accent-bg: #1f3530; --open: #ea8f72; --warm: #e6ad5c;
    --k-rolstoel: #3f8f7f; --k-rollator: #b8702e; --k-looprek: #8a63a0; --k-kruk: #b05a78;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1916; --surface: #25221e; --fg: #f1eae0; --muted: #b3a698; --line: #3b352f;
  --accent: #86cdb9; --accent-fg: #0f2621; --accent-bg: #1f3530; --open: #ea8f72; --warm: #e6ad5c;
  --k-rolstoel: #3f8f7f; --k-rollator: #b8702e; --k-looprek: #8a63a0; --k-kruk: #b05a78;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; min-height: 100vh; background: radial-gradient(900px 420px at 10% -120px, color-mix(in srgb, var(--warm) 22%, transparent), transparent 70%), radial-gradient(800px 380px at 100% -80px, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%), var(--bg); background-repeat: no-repeat; color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 24px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: -.01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.rechts { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
.install { display: flex; gap: 12px; align-items: start; justify-content: space-between; }
.who { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.login { max-width: 420px; }
/* Offline / wijzigingen die nog verstuurd moeten worden */
.sync { font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--accent-bg); color: var(--accent); white-space: nowrap; }
.sync.wacht { background: #fcefd6; color: #8a5300; }
.sign { width: 52px; height: 52px; flex: none; border: 0; padding: 0; cursor: pointer; border-radius: 18px; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--warm))); display: grid; place-items: center; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); transform: rotate(-4deg); }
.sign svg { width: 28px; height: 28px; transform: rotate(4deg); }
.eyebrow { font-size: .85rem; color: var(--muted); font-weight: 600; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--accent); text-decoration: none; cursor: pointer; }
.crumbs button:hover { text-decoration: underline; text-underline-offset: 3px; }
.muted { color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 99px; cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-fg); }
.btn.danger { color: var(--open); }
.btn.small { padding: 4px 12px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Sites */
.sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.site { --k: var(--accent); position: relative; overflow: hidden; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 18px 18px; cursor: pointer; display: grid; gap: 10px; }
.site::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: linear-gradient(90deg, var(--k), color-mix(in srgb, var(--k) 45%, var(--warm))); }
.site { isolation: isolate; }
.site::after { content: ""; z-index: -1; position: absolute; right: -40px; top: -40px; width: 120px; height: 120px; border-radius: 50%; background: color-mix(in srgb, var(--k) 10%, transparent); pointer-events: none; }
.site:hover { border-color: var(--k); }
.kaart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: grid; align-content: start; box-shadow: var(--shadow); }
.kaart:hover { border-color: var(--accent); }
.kaart > .site { border: 0; background: none; }
.kaart-acties { padding: 0 16px 16px; display: flex; gap: 8px; }
.site h3 { font-size: 1.3rem; color: color-mix(in srgb, var(--k) 60%, var(--fg)); }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent-bg); color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.last { font-size: .85rem; color: var(--muted); }

/* Panels & forms */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: grid; gap: 4px; flex: 1 1 180px; min-width: 0; }
.field.wide { flex-basis: 100%; }
fieldset.loc-set { border: 0; padding: 0; margin: 0; }
fieldset.loc-set legend { padding: 0; margin-bottom: 4px; }
label.lbl.sub { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: .85rem; }
.lbl { font-size: .85rem; font-weight: 700; color: var(--muted); }
input[type=text], input[type=date], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); padding: 8px 12px; border-radius: 10px; }
textarea { min-height: 72px; resize: vertical; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* Kaarten (toestellen in een nazicht) */
.list { display: grid; gap: 8px; }
.staal { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 16px; display: grid; gap: 8px; }
.staal-top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; justify-content: space-between; }
.subject { font-weight: 600; }
.date { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.staal p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
.fotos { display: flex; flex-wrap: wrap; gap: 8px; }
.foto-veld { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.foto-veld input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.foto-veld label.btn { cursor: pointer; }
.foto-keuze { position: relative; }
.foto-keuze button { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; padding: 0; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--open); cursor: pointer; line-height: 1; font-weight: 600; }
.duim { width: 96px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: block; }
button.duim-knop { padding: 0; border: 0; background: none; cursor: zoom-in; }
.groot { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.9); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
.groot.twee { gap: 16px; }
.groot.twee img { max-width: calc(50vw - 24px); }
@media (orientation: portrait) { .groot.twee { flex-direction: column; } .groot.twee img { max-width: calc(100vw - 32px); max-height: calc(50dvh - 24px); } }
.duims { display: flex; gap: 6px; flex-shrink: 0; }
.duims .duim-knop { flex-shrink: 0; }
/* Op een smal scherm staan de foto's onder de tekst, zodat ze er niet over komen. */
@media (max-width: 560px) {
  .punt-midden { flex-direction: column; }
  .vast > .duims { grid-column: 2 / -1; }
}
.plakvakken { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.groot img { display: block; width: auto; height: auto; object-fit: contain; border-radius: 10px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.staal-bottom { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: flex-end; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 24px 16px; text-align: center; color: var(--muted); }
.banner { padding: 10px 14px; border-radius: var(--radius); background: #fcefd6; color: #8a5300; font-size: .9rem; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: .9rem; }
@media (prefers-reduced-motion: no-preference) { .site, .kaart, .btn, .ronde, .keuze { transition: border-color .15s, color .15s, filter .15s, transform .15s, background-color .15s; } .site:hover, .kaart:hover, .ronde:hover { transform: translateY(-2px); } }

/* Rondes en vaste punten */
:root { --ok: #3d7a34; --ok-bg: #e5f0dc; --open-bg: #f8e4db; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #93cf84; --ok-bg: #22331d; --open-bg: #3e251c; } }
:root[data-theme="dark"] { --ok: #93cf84; --ok-bg: #22331d; --open-bg: #3e251c; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.open { background: var(--open-bg); color: var(--open); }
.ronde { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 16px; cursor: pointer; text-align: left; width: 100%; }
.ronde:hover { border-color: var(--accent); }
.ronde .date { min-width: 7.5em; font-size: 1.3rem; }
.staal.genomen { border-left-color: var(--ok); }
.staal.te-doen { border-left-color: var(--line); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
.check input { width: 20px; height: 20px; accent-color: var(--ok); }
.tabel-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); max-height: 320px; }
.tabel-wrap table { border-collapse: collapse; font-size: .85rem; width: 100%; }
.tabel-wrap th, .tabel-wrap td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; white-space: nowrap; }
.tabel-wrap th { position: sticky; top: 0; background: var(--accent-bg); color: var(--accent); }
.checks { display: flex; gap: 10px 18px; flex-wrap: wrap; }
.vast { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 16px; }
.vast-tekst { display: grid; gap: 4px; min-width: 0; overflow-wrap: anywhere; }
.vast-acties { grid-column: 1 / -1; justify-content: flex-end; }
.plakvak { border: 2px dashed var(--line); border-radius: var(--radius); padding: 14px; text-align: center; color: var(--muted); cursor: pointer; font-size: .9rem; }
.plakvak:focus, .plakvak.over { border-color: var(--accent); color: var(--fg); outline: none; background: var(--accent-bg); }
.plakvak:focus::after { content: " · klaar om te plakken"; font-weight: 600; }
.nr { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 6px; }
.punt-midden { display: flex; gap: 12px; justify-content: space-between; align-items: start; }
.titel-knop { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: zoom-in; }

/* Nazicht VIGO */
:root { --weg: #776b5f; --weg-bg: #ede8e1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --weg: #b3a698; --weg-bg: #34302b; } }
:root[data-theme="dark"] { --weg: #b3a698; --weg-bg: #34302b; }
.pill.weg { background: var(--weg-bg); color: var(--weg); }
.staal.ok { border-left-color: var(--ok); }
.staal.open { border-left-color: var(--open); }
.staal.weg { border-left-color: var(--weg); }
.soort { --k: var(--accent); display: inline-block; font-size: .75rem; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: color-mix(in srgb, var(--k) 15%, var(--surface)); color: color-mix(in srgb, var(--k) 80%, var(--fg)); vertical-align: 2px; white-space: nowrap; }
.soort-rolstoel { --k: var(--k-rolstoel); } .soort-rollator { --k: var(--k-rollator); } .soort-looprek { --k: var(--k-looprek); } .soort-kruk { --k: var(--k-kruk); }
.vast { border-left: 5px solid var(--k, var(--line)); }
.pill[class*="soort-"] { background: color-mix(in srgb, var(--k) 14%, var(--surface)); color: color-mix(in srgb, var(--k) 80%, var(--fg)); }
h3 { color: color-mix(in srgb, var(--accent) 35%, var(--fg)); }
details.panel > summary { cursor: pointer; list-style: none; }
details.panel > summary::before { content: "▸ "; color: var(--warm); }
details.panel[open] > summary::before { content: "▾ "; }
.vast > .soort { margin-top: 3px; min-width: 5.2em; text-align: center; }
.site { align-content: start; }
.vast.uit { opacity: .65; }
.herstel { display: grid; gap: 4px; }
.herstel textarea { min-height: 64px; }
.keuzes { display: flex; flex-wrap: wrap; gap: 6px; }
.keuze { border: 1px solid var(--line); background: var(--bg); padding: 6px 12px; border-radius: 99px; cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--muted); }
.keuze:hover { border-color: var(--accent); color: var(--fg); }
.keuze.ok[aria-pressed=true] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.keuze.open[aria-pressed=true] { background: var(--open); border-color: var(--open); color: var(--surface); }
.keuze.weg[aria-pressed=true] { background: var(--weg); border-color: var(--weg); color: var(--surface); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <button class="sign" type="button" data-go-sites title="Naar het overzicht van de sites" aria-label="Naar het overzicht van de sites">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="3.6" r="1.6" fill="#fff" stroke="none"/><path d="M9 7v6h6l2.5 5.5"/><path d="M9 9.5h4.5"/><path d="M6.6 10.6A5.5 5.5 0 1 0 14 17.5"/></svg>
    </button>
    <div>
      <div class="eyebrow">Rolstoelen, rollators, looprekken en krukken</div>
      <h1>Nazicht VIGO</h1>
    </div>
    <div class="rechts"><button class="btn small primary" id="installeer" type="button" hidden>App installeren</button>
    <div id="who" class="who" hidden><span id="sync" class="sync" role="status" hidden></span><span id="who-mail"></span><button class="btn small" id="logout" type="button">Afmelden</button></div></div>
  </header>
  <div id="install-uitleg" class="banner install" hidden></div>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/supabase-2.116.0.js"></script>
